name: CI

on:
  # The Version workflow dispatches CI on its PR, which a bot token cannot
  # trigger through pull_request.
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (${{ matrix.runner }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        runner: [blacksmith-4vcpu-ubuntu-2404, blacksmith-4vcpu-ubuntu-2404-arm]
    steps:
      - name: Check out repository
        # actions/checkout@v4.2.2
        uses: useblacksmith/checkout@v1

      - name: Install toolchain from rust-toolchain.toml
        # dtolnay/rust-toolchain@master (pin)
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: 1.97.1
          components: clippy, rustfmt

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run Clippy
        run: cargo clippy --all-targets --all-features --locked -- -D warnings

      - name: Run tests
        run: cargo test --all-targets --locked

      - name: Build release binary
        run: cargo build --release --locked

  musl-build:
    name: Musl build (${{ matrix.target }})
    runs-on: blacksmith-4vcpu-ubuntu-2404
    strategy:
      fail-fast: false
      matrix:
        target:
          - x86_64-unknown-linux-musl
          - aarch64-unknown-linux-musl
    steps:
      - name: Check out repository
        # actions/checkout@v4.2.2
        uses: useblacksmith/checkout@v1

      - name: Install toolchain from rust-toolchain.toml
        # dtolnay/rust-toolchain@master (pin)
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: 1.97.1
          components: clippy, rustfmt
          targets: ${{ matrix.target }}

      - name: Install Zig
        # mlugg/setup-zig@v2.0.5
        uses: mlugg/setup-zig@8d6198c65fb0feaa111df26e6b467fea8345e46f
        with:
          version: 0.15.2

      - name: Install cargo-zigbuild
        run: cargo install --locked --version 0.23.0 cargo-zigbuild

      - name: Build static musl release target
        run: cargo zigbuild --locked --release --target "${{ matrix.target }}"

  package-scripts:
    name: Package script and GoReleaser checks
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - name: Check out repository
        # actions/checkout@v4.2.2
        uses: useblacksmith/checkout@v1
        with:
          fetch-depth: 0

      - name: Install toolchain from rust-toolchain.toml
        # dtolnay/rust-toolchain@master (pin)
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: 1.97.1
          components: clippy, rustfmt

      - name: Install GoReleaser
        # goreleaser/goreleaser-action@v7.2.3
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94
        with:
          distribution: goreleaser
          version: v2.17.1
          install-only: true

      - name: Validate GoReleaser config
        run: goreleaser check

      - name: Run packaging script tests
        run: cargo test --locked --test release_packaging

      - name: Install Node
        # actions/setup-node@v7.1.0
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24
          cache: npm

      - name: Run release version tests
        run: |
          npm ci
          npm run test:release
