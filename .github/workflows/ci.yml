name: CI

on:
  # The Version workflow dispatches CI on its PR, which a bot token cannot
  # trigger through pull_request.
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read
  # Lets a failed job cancel the rest of the run.
  actions: write

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Each job runs only when a file it reads changed. Docs and the web console
  # change nothing CI checks: the packaging test reads README.md and LICENSE
  # only to check that they exist, and CI does not build web/. A dispatched
  # run, from the Version workflow, runs every job.
  changes:
    name: Detect changes
    runs-on: blacksmith-4vcpu-ubuntu-2404
    outputs:
      rust: ${{ steps.filter.outputs.rust }}
      packaging: ${{ steps.filter.outputs.packaging }}
    steps:
      - name: Check out repository
        # actions/checkout@v4.2.2
        uses: useblacksmith/checkout@v1
        with:
          fetch-depth: 0

      - name: Match changed files
        id: filter
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
        run: |
          rust='^(src/|tests/|schema/|build\.rs$|Cargo\.(toml|lock)$|\.cargo/config\.toml$|rust-toolchain\.toml$|\.github/workflows/ci\.yml$)'
          packaging='^(scripts/|site/public/install\.sh$|\.goreleaser\.yaml$|package(-lock)?\.json$|\.changeset/config\.json$)'

          # A pull request checks out its merge commit, whose first parent is
          # the base. A push compares with the commit before it. Anything else,
          # or a base this clone lacks, runs every job.
          if [ "$EVENT" = pull_request ]; then
            base=HEAD^1
          elif [ "$EVENT" = push ] && git cat-file -e "${BEFORE}^{commit}" 2>/dev/null; then
            base=$BEFORE
          else
            echo "rust=true" >> "$GITHUB_OUTPUT"
            echo "packaging=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          files=$(git diff --name-only "$base" HEAD)
          printf 'Changed files:\n%s\n' "$files"
          has() { printf '%s\n' "$files" | grep -Eq "$1" && echo true || echo false; }
          rust_changed=$(has "$rust")
          packaging_changed=$(has "$packaging")
          [ "$rust_changed" = true ] && packaging_changed=true
          echo "rust=$rust_changed" >> "$GITHUB_OUTPUT"
          echo "packaging=$packaging_changed" >> "$GITHUB_OUTPUT"

  test:
    name: Test (${{ matrix.runner }})
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        runner: [blacksmith-4vcpu-ubuntu-2404, blacksmith-4vcpu-ubuntu-2404-arm]
    steps:
      - name: Check out repository
        # actions/checkout@v4.2.2
        uses: useblacksmith/checkout@v1

      - name: Install toolchain from rust-toolchain.toml
        # dtolnay/rust-toolchain@master (pin)
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: 1.97.1
          components: clippy, rustfmt

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run Clippy
        run: cargo clippy --all-targets --all-features --locked -- -D warnings

      - name: Run tests
        run: cargo test --all-targets --locked

      - name: Build release binary
        run: cargo build --release --locked

      # One failure fails the run, so the other jobs stop instead of spending
      # minutes on a result that no longer matters.
      - name: Cancel the run on failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run cancel "${{ github.run_id }}" --repo "${{ github.repository }}"

  # macOS runs the console and the PostgreSQL part of a capture. Most
  # integration tests read a Linux host, so this job runs the console tests
  # and the release smoke test, which captures with Linux unsupported.
  macos:
    name: macOS check
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: blacksmith-6vcpu-macos-latest
    steps:
      - name: Check out repository
        # actions/checkout@v4.2.2
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Install toolchain from rust-toolchain.toml
        # dtolnay/rust-toolchain@master (pin)
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: 1.97.1
          components: clippy

      - name: Run Clippy
        run: cargo clippy --all-targets --all-features --locked -- -D warnings

      - name: Run console tests
        run: cargo test --locked --test analyze_cli

      - name: Build and smoke-test the release binary
        run: |
          set -euo pipefail
          cargo build --release --locked
          scripts/smoke-test-release-binary.sh target/release/pg-probe work

      # One failure fails the run, so the other jobs stop instead of spending
      # minutes on a result that no longer matters.
      - name: Cancel the run on failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run cancel "${{ github.run_id }}" --repo "${{ github.repository }}"

  musl-build:
    name: Musl build (${{ matrix.target }})
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: blacksmith-4vcpu-ubuntu-2404
    strategy:
      matrix:
        target:
          - x86_64-unknown-linux-musl
          - aarch64-unknown-linux-musl
    steps:
      - name: Check out repository
        # actions/checkout@v4.2.2
        uses: useblacksmith/checkout@v1

      - name: Install toolchain from rust-toolchain.toml
        # dtolnay/rust-toolchain@master (pin)
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: 1.97.1
          components: clippy, rustfmt
          targets: ${{ matrix.target }}

      - name: Install Zig
        # mlugg/setup-zig@v2.0.5
        uses: mlugg/setup-zig@8d6198c65fb0feaa111df26e6b467fea8345e46f
        with:
          version: 0.15.2

      - name: Install cargo-zigbuild
        run: cargo install --locked --version 0.23.0 cargo-zigbuild

      - name: Build static musl release target
        run: cargo zigbuild --locked --release --target "${{ matrix.target }}"

      # One failure fails the run, so the other jobs stop instead of spending
      # minutes on a result that no longer matters.
      - name: Cancel the run on failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run cancel "${{ github.run_id }}" --repo "${{ github.repository }}"

  package-scripts:
    name: Package script and GoReleaser checks
    needs: changes
    if: needs.changes.outputs.packaging == 'true'
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - name: Check out repository
        # actions/checkout@v4.2.2
        uses: useblacksmith/checkout@v1
        with:
          fetch-depth: 0

      - name: Install toolchain from rust-toolchain.toml
        # dtolnay/rust-toolchain@master (pin)
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: 1.97.1
          components: clippy, rustfmt

      - name: Install GoReleaser
        # goreleaser/goreleaser-action@v7.2.3
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94
        with:
          distribution: goreleaser
          version: v2.17.1
          install-only: true

      - name: Validate GoReleaser config
        run: goreleaser check

      - name: Run packaging script tests
        run: cargo test --locked --test release_packaging

      - name: Install Node
        # actions/setup-node@v7.1.0
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24
          cache: npm

      - name: Run release version tests
        run: |
          npm ci
          npm run test:release

      # One failure fails the run, so the other jobs stop instead of spending
      # minutes on a result that no longer matters.
      - name: Cancel the run on failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run cancel "${{ github.run_id }}" --repo "${{ github.repository }}"
