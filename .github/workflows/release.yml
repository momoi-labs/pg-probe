name: Release

# Protected SemVer tags (vMAJOR.MINOR.PATCH) trigger this workflow.
# Builds use GoReleaser's Rust builder (cargo-zigbuild). No pull_request /
# pull_request_target triggers. The R2 upload reads secrets from the release
# environment and is skipped when vars.R2_BUCKET is unset.

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
  # The Version workflow calls this after it tags a merged version PR, since
  # a tag pushed with GITHUB_TOKEN does not trigger the push event.
  workflow_call:
    inputs:
      tag:
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to retry
        required: true

permissions: {}

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  # goreleaser/goreleaser v2.17.1
  GORELEASER_VERSION: v2.17.1
  TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  validate:
    name: Validate tag and tree
    runs-on: blacksmith-4vcpu-ubuntu-2404
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Check out the tagged commit
        # actions/checkout@v4.2.2
        uses: useblacksmith/checkout@v1
        with:
          ref: refs/tags/${{ env.TAG }}
          fetch-depth: 0

      - name: Verify tag matches Cargo.toml version
        id: version
        run: |
          set -euo pipefail
          tag="${TAG}"
          case "$tag" in
            v[0-9]*.[0-9]*.[0-9]*) ;;
            *)
              echo "tag is not a SemVer release tag: ${tag}" >&2
              exit 1
              ;;
          esac
          version="${tag#v}"
          cargo_version="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n1)"
          if [[ "$version" != "$cargo_version" ]]; then
            echo "tag version ${version} does not match Cargo.toml version ${cargo_version}" >&2
            exit 1
          fi
          # Changesets keeps package.json, Cargo.toml and Cargo.lock in step.
          node scripts/release-version.mjs check "$version"
          echo "version=${version}" >>"$GITHUB_OUTPUT"

      - name: Install toolchain from rust-toolchain.toml
        # dtolnay/rust-toolchain@master (pin)
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: 1.97.1
          components: clippy, rustfmt

      - name: Install GoReleaser
        # goreleaser/goreleaser-action@v7.2.3
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94
        with:
          distribution: goreleaser
          version: ${{ env.GORELEASER_VERSION }}
          install-only: true

      - name: Validate GoReleaser config
        run: goreleaser check

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run Clippy
        run: cargo clippy --all-targets --all-features --locked -- -D warnings

      - name: Run tests
        run: cargo test --all-targets --locked

      - name: Verify lockfile is committed and current
        run: |
          set -euo pipefail
          cargo metadata --locked --format-version 1 >/dev/null
          git diff --exit-code -- Cargo.lock

  build:
    name: GoReleaser build musl archives
    needs: validate
    runs-on: blacksmith-4vcpu-ubuntu-2404
    permissions:
      contents: read
    steps:
      - name: Check out the tagged commit
        # actions/checkout@v4.2.2
        uses: useblacksmith/checkout@v1
        with:
          ref: refs/tags/${{ env.TAG }}
          fetch-depth: 0

      - name: Install toolchain from rust-toolchain.toml
        # dtolnay/rust-toolchain@master (pin)
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: 1.97.1
          components: clippy, rustfmt
          targets: x86_64-unknown-linux-musl,aarch64-unknown-linux-musl

      - name: Install Zig
        # mlugg/setup-zig@v2.0.5
        uses: mlugg/setup-zig@8d6198c65fb0feaa111df26e6b467fea8345e46f
        with:
          version: 0.15.2

      - name: Install cargo-zigbuild
        run: cargo install --locked --version 0.23.0 cargo-zigbuild

      - name: Install GoReleaser
        # goreleaser/goreleaser-action@v7.2.3
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94
        with:
          distribution: goreleaser
          version: ${{ env.GORELEASER_VERSION }}
          install-only: true

      - name: Install Node
        # actions/setup-node@v7.1.0
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24

      # pg-probe analyze embeds web/dist at compile time, so the console is
      # built once, before GoReleaser compiles either target.
      - name: Build the review console
        run: |
          set -euo pipefail
          npm install --global pnpm@12.14.0
          pnpm --dir web install --frozen-lockfile
          pnpm --dir web build

      - name: Build and archive with GoReleaser
        run: |
          set -euo pipefail
          export SOURCE_DATE_EPOCH="$(git show -s --format=%ct HEAD)"
          # release.disable in .goreleaser.yaml prevents publication here.
          goreleaser release --clean --skip=publish

      - name: Verify archives and static linking
        run: |
          set -euo pipefail
          version="${{ needs.validate.outputs.version }}"
          for target in x86_64-unknown-linux-musl aarch64-unknown-linux-musl; do
            archive="dist/pg-probe-v${version}-${target}.tar.gz"
            test -f "$archive"
            mkdir -p "verify/${target}"
            tar -xzf "$archive" -C "verify/${target}"
            binary="verify/${target}/pg-probe-v${version}-${target}/pg-probe"
            test -x "$binary"
            file "$binary"
            if ! grep -aq "/console/assets/" "$binary"; then
              echo "the review console is not embedded in ${binary}" >&2
              exit 1
            fi
            if [[ "$target" == "x86_64-unknown-linux-musl" ]]; then
              if ldd "$binary" >/tmp/ldd.out 2>&1; then
                echo "expected a static musl binary, but ldd reported dynamic libs:" >&2
                cat /tmp/ldd.out >&2
                exit 1
              fi
            fi
          done
          test -f dist/SHA256SUMS
          for package in \
            "dist/pg-probe_${version}_amd64.deb" \
            "dist/pg-probe_${version}_arm64.deb" \
            "dist/pg-probe-${version}-1.x86_64.rpm" \
            "dist/pg-probe-${version}-1.aarch64.rpm"; do
            test -f "$package"
          done

      - name: Upload release dist
        # actions/upload-artifact@v4.6.2
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: release-dist
          path: |
            dist/pg-probe-v${{ needs.validate.outputs.version }}-x86_64-unknown-linux-musl.tar.gz
            dist/pg-probe-v${{ needs.validate.outputs.version }}-aarch64-unknown-linux-musl.tar.gz
            dist/pg-probe_${{ needs.validate.outputs.version }}_*.deb
            dist/pg-probe-${{ needs.validate.outputs.version }}-1.*.rpm
            dist/SHA256SUMS
          if-no-files-found: error
          retention-days: 7

  native-test:
    name: Native test (${{ matrix.runner }})
    needs: [validate, build]
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: blacksmith-4vcpu-ubuntu-2404
            target: x86_64-unknown-linux-musl
            deb_arch: amd64
            rpm_arch: x86_64
          - runner: blacksmith-4vcpu-ubuntu-2404-arm
            target: aarch64-unknown-linux-musl
            deb_arch: arm64
            rpm_arch: aarch64
    steps:
      - name: Check out the tagged commit
        # actions/checkout@v4.2.2
        uses: useblacksmith/checkout@v1
        with:
          ref: refs/tags/${{ env.TAG }}

      - name: Download GoReleaser dist
        # actions/download-artifact@v4.3.0
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: release-dist
          path: dist

      - name: Install sqlite3 for artifact checks
        run: sudo apt-get update && sudo apt-get install -y sqlite3

      - name: Extract and smoke-test on Ubuntu (Debian family)
        run: |
          set -euo pipefail
          archive="dist/pg-probe-v${{ needs.validate.outputs.version }}-${{ matrix.target }}.tar.gz"
          test -f "$archive"
          mkdir -p extracted work
          tar -xzf "$archive" -C extracted
          binary="extracted/pg-probe-v${{ needs.validate.outputs.version }}-${{ matrix.target }}/pg-probe"
          scripts/smoke-test-release-binary.sh "$binary" work/ubuntu

      # The binary links no libc, so the packages must declare no dependency.
      - name: Install and smoke-test the Debian package
        run: |
          set -euo pipefail
          package="dist/pg-probe_${{ needs.validate.outputs.version }}_${{ matrix.deb_arch }}.deb"
          depends="$(dpkg-deb -f "$package" Depends)"
          if [[ -n "$depends" ]]; then
            echo "the Debian package declares dependencies: ${depends}" >&2
            exit 1
          fi
          sudo dpkg -i "$package"
          scripts/smoke-test-release-binary.sh /usr/bin/pg-probe work/deb
          sudo dpkg -r pg-probe

      - name: Smoke-test inside Rocky Linux (RHEL-compatible)
        run: |
          set -euo pipefail
          binary="extracted/pg-probe-v${{ needs.validate.outputs.version }}-${{ matrix.target }}/pg-probe"
          mkdir -p work/rocky
          # rockylinux:9 index digest (multi-arch)
          docker run --rm \
            -v "${PWD}/${binary}:/usr/local/bin/pg-probe:ro" \
            -v "${PWD}/scripts/smoke-test-release-binary.sh:/smoke.sh:ro" \
            -v "${PWD}/work/rocky:/work" \
            rockylinux@sha256:d7be1c094cc5845ee815d4632fe377514ee6ebcf8efaed6892889657e5ddaaa6 \
            bash -lc 'dnf install -y gzip >/dev/null && SMOKE_SQL_CHECK=0 bash /smoke.sh /usr/local/bin/pg-probe /work'
          # Rocky's sqlite3 is too old for STRICT tables; check on the host.
          scripts/smoke-test-release-binary.sh --check-artifact work/rocky

      - name: Install and smoke-test the RPM package inside Rocky Linux
        run: |
          set -euo pipefail
          package="dist/pg-probe-${{ needs.validate.outputs.version }}-1.${{ matrix.rpm_arch }}.rpm"
          mkdir -p work/rpm
          # rockylinux:9 index digest (multi-arch)
          docker run --rm \
            -v "${PWD}/${package}:/pg-probe.rpm:ro" \
            -v "${PWD}/scripts/smoke-test-release-binary.sh:/smoke.sh:ro" \
            -v "${PWD}/work/rpm:/work" \
            rockylinux@sha256:d7be1c094cc5845ee815d4632fe377514ee6ebcf8efaed6892889657e5ddaaa6 \
            bash -lc 'set -euo pipefail
              requires="$(rpm -qpR /pg-probe.rpm | grep -v "^rpmlib(" || true)"
              if [[ -n "$requires" ]]; then
                echo "the RPM package declares dependencies: $requires" >&2
                exit 1
              fi
              rpm -i /pg-probe.rpm
              dnf install -y gzip >/dev/null
              SMOKE_SQL_CHECK=0 bash /smoke.sh /usr/bin/pg-probe /work'
          scripts/smoke-test-release-binary.sh --check-artifact work/rpm

      - name: Smoke-test inside Alpine
        run: |
          set -euo pipefail
          binary="extracted/pg-probe-v${{ needs.validate.outputs.version }}-${{ matrix.target }}/pg-probe"
          mkdir -p work/alpine
          # alpine:3.21 index digest (multi-arch)
          docker run --rm \
            -v "${PWD}/${binary}:/usr/local/bin/pg-probe:ro" \
            -v "${PWD}/scripts/smoke-test-release-binary.sh:/smoke.sh:ro" \
            -v "${PWD}/work/alpine:/work" \
            alpine@sha256:48b0309ca019d89d40f670aa1bc06e426dc0931948452e8491e3d65087abc07d \
            sh -lc 'apk add --no-cache bash sqlite gzip >/dev/null && bash /smoke.sh /usr/local/bin/pg-probe /work'

  publish:
    name: Publish release
    needs: [validate, build, native-test]
    runs-on: blacksmith-4vcpu-ubuntu-2404
    environment: release
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Check out the tagged commit
        # actions/checkout@v4.2.2
        uses: useblacksmith/checkout@v1
        with:
          ref: refs/tags/${{ env.TAG }}

      - name: Fail if the release already exists
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="${TAG}"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "release ${tag} already exists" >&2
            exit 1
          fi

      - name: Download GoReleaser dist
        # actions/download-artifact@v4.3.0
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: release-dist
          path: dist

      - name: Reject unexpected files and verify SHA256SUMS
        run: |
          set -euo pipefail
          version="${{ needs.validate.outputs.version }}"
          expected="$(printf '%s\n' \
            "pg-probe-v${version}-x86_64-unknown-linux-musl.tar.gz" \
            "pg-probe-v${version}-aarch64-unknown-linux-musl.tar.gz" \
            "pg-probe_${version}_amd64.deb" \
            "pg-probe_${version}_arm64.deb" \
            "pg-probe-${version}-1.x86_64.rpm" \
            "pg-probe-${version}-1.aarch64.rpm" \
            SHA256SUMS | LC_ALL=C sort)"
          actual="$(find dist -maxdepth 1 -type f -printf '%f\n' | LC_ALL=C sort)"
          if [[ "$actual" != "$expected" ]]; then
            echo "unexpected dist contents:" >&2
            echo "$actual" >&2
            exit 1
          fi
          (cd dist && sha256sum -c SHA256SUMS)

      # install.sh downloads from this bucket, which stays public while the
      # repository is private. Versioned files are cached as immutable, so a
      # retry never replaces them: SHA256SUMS goes up last, and once it is
      # there the upload only checks that it matches. latest.txt only moves
      # forward, so an older release that finishes late does not take it back.
      - name: Upload assets to R2
        if: ${{ vars.R2_BUCKET != '' }}
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          AWS_REQUEST_CHECKSUM_CALCULATION: when_required
          AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
          R2_ENDPOINT: https://${{ vars.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com
          R2_BUCKET: ${{ vars.R2_BUCKET }}
        run: |
          set -euo pipefail
          version="${{ needs.validate.outputs.version }}"
          prefix="s3://${R2_BUCKET}/v${version}"
          r2() {
            aws s3 cp --endpoint-url "$R2_ENDPOINT" --no-progress "$@"
          }
          if r2 "${prefix}/SHA256SUMS" remote-sums 2>/dev/null; then
            if ! cmp -s remote-sums dist/SHA256SUMS; then
              echo "R2 already holds different files for v${version}" >&2
              exit 1
            fi
            echo "R2 already holds v${version}"
          else
            for file in \
              "pg-probe-v${version}-x86_64-unknown-linux-musl.tar.gz" \
              "pg-probe-v${version}-aarch64-unknown-linux-musl.tar.gz" \
              "pg-probe_${version}_amd64.deb" \
              "pg-probe_${version}_arm64.deb" \
              "pg-probe-${version}-1.x86_64.rpm" \
              "pg-probe-${version}-1.aarch64.rpm" \
              SHA256SUMS; do
              r2 --cache-control "public, max-age=31536000, immutable" \
                "dist/${file}" "${prefix}/${file}"
            done
          fi
          current=""
          if r2 "s3://${R2_BUCKET}/latest.txt" remote-latest 2>/dev/null; then
            current="$(tr -d ' \r\n' <remote-latest)"
          fi
          newest="$(printf '%s\n%s\n' "$current" "$version" | sort -V | tail -n 1)"
          if [[ "$current" == "$version" || "$newest" != "$version" ]]; then
            echo "latest.txt stays at ${current}"
            exit 0
          fi
          printf '%s\n' "$version" >latest.txt
          r2 --cache-control "public, max-age=300" --content-type text/plain \
            latest.txt "s3://${R2_BUCKET}/latest.txt"

      - name: Attest release assets
        # GitHub stores artifact attestations only for public repositories on
        # the organization's current plan, so a private repository skips them.
        if: ${{ !github.event.repository.private }}
        # actions/attest-build-provenance@v2.4.0
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be
        with:
          subject-path: |
            dist/pg-probe-v${{ needs.validate.outputs.version }}-x86_64-unknown-linux-musl.tar.gz
            dist/pg-probe-v${{ needs.validate.outputs.version }}-aarch64-unknown-linux-musl.tar.gz
            dist/pg-probe_${{ needs.validate.outputs.version }}_*.deb
            dist/pg-probe-${{ needs.validate.outputs.version }}-1.*.rpm
            dist/SHA256SUMS

      - name: Create draft release and upload assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="${TAG}"
          version="${{ needs.validate.outputs.version }}"
          changes="$(node scripts/release-version.mjs notes)"
          attest_notes=""
          if [[ "${{ github.event.repository.private }}" != "true" ]]; then
            attest_notes="$(cat <<EOF
          ### Verify attestations

          The assets carry GitHub build provenance attestations.

          \`\`\`sh
          gh attestation verify --repo ${{ github.repository }} \\
            pg-probe-v${version}-x86_64-unknown-linux-musl.tar.gz
          gh attestation verify --repo ${{ github.repository }} \\
            pg-probe-v${version}-aarch64-unknown-linux-musl.tar.gz
          \`\`\`
          EOF
          )"
          fi
          notes="$(cat <<EOF
          ## pg-probe ${tag}

          ${changes}

          Static musl Linux builds with the Rust-native PostgreSQL client and
          rustls, produced by GoReleaser's Rust builder. The binary links no
          libc, so the packages declare no dependencies and install on any
          release of their family.

          ### Assets

          - \`pg-probe-v${version}-x86_64-unknown-linux-musl.tar.gz\`
          - \`pg-probe-v${version}-aarch64-unknown-linux-musl.tar.gz\`
          - \`pg-probe_${version}_amd64.deb\`, \`pg-probe_${version}_arm64.deb\`
          - \`pg-probe-${version}-1.x86_64.rpm\`, \`pg-probe-${version}-1.aarch64.rpm\`
          - \`SHA256SUMS\`

          ### Install a package

          \`\`\`sh
          sudo dpkg -i pg-probe_${version}_amd64.deb      # Debian, Ubuntu
          sudo rpm -i pg-probe-${version}-1.x86_64.rpm    # RHEL, Rocky, CentOS
          \`\`\`

          ### Verify checksums

          \`\`\`sh
          sha256sum -c SHA256SUMS
          \`\`\`

          ${attest_notes}

          Builds are repeatable. This project does not claim bit-for-bit
          reproducible Rust binaries until independent rebuild-and-compare
          evidence exists.
          EOF
          )"
          gh release create "$tag" \
            --draft \
            --title "$tag" \
            --notes "$notes" \
            "dist/pg-probe-v${version}-x86_64-unknown-linux-musl.tar.gz" \
            "dist/pg-probe-v${version}-aarch64-unknown-linux-musl.tar.gz" \
            "dist/pg-probe_${version}_amd64.deb" \
            "dist/pg-probe_${version}_arm64.deb" \
            "dist/pg-probe-${version}-1.x86_64.rpm" \
            "dist/pg-probe-${version}-1.aarch64.rpm" \
            dist/SHA256SUMS

      - name: Publish the fully populated draft
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="${TAG}"
          version="${{ needs.validate.outputs.version }}"
          expected="$(printf '%s\n' \
            "pg-probe-v${version}-x86_64-unknown-linux-musl.tar.gz" \
            "pg-probe-v${version}-aarch64-unknown-linux-musl.tar.gz" \
            "pg-probe_${version}_amd64.deb" \
            "pg-probe_${version}_arm64.deb" \
            "pg-probe-${version}-1.x86_64.rpm" \
            "pg-probe-${version}-1.aarch64.rpm" \
            SHA256SUMS | LC_ALL=C sort)"
          assets="$(gh release view "$tag" --json assets --jq '.assets[].name' | LC_ALL=C sort)"
          if [[ "$assets" != "$expected" ]]; then
            echo "draft release assets mismatch:" >&2
            echo "$assets" >&2
            exit 1
          fi
          gh release edit "$tag" --draft=false
