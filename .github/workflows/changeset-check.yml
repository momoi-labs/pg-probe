name: Changeset

# A pull request that changes what ships in the pg-probe binary must add or
# edit a changeset, so the release notes cannot miss it. The no-changeset
# label skips the check for changes users do not see. This lives apart from
# CI so that adding or removing the label reruns only this check.

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, labeled, unlabeled]
  # The Version workflow runs this on the version PR, which consumes the
  # changesets instead of adding one, so the check reports a pass there.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: changeset-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changeset:
    name: Changeset
    # The version PR consumes the changesets instead of adding one. GitHub
    # now runs pull_request workflows on it too, so skip the check there.
    if: >-
      ${{ !contains(github.event.pull_request.labels.*.name, 'no-changeset') &&
      github.head_ref != 'changeset-release/main' }}
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        # actions/checkout@v4.2.2
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 2

      # A pull request checks out its merge commit, whose first parent is the
      # base.
      - name: Require a changeset
        if: github.event_name == 'pull_request'
        run: scripts/check-changeset.sh HEAD^1 HEAD
