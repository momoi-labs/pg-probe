# Cross configuration for attested musl release builds (used by GoReleaser's
# rust builder with `tool: cross`).
# Images are pinned by digest so a floating tag cannot silently change inputs.
# cross git revision used by automation: 55f847251389c5406df85579191c0eac412fab3a

[build]
# Prefer the workspace lockfile for every release and CI cross build.
default-target = "x86_64-unknown-linux-musl"

[target.x86_64-unknown-linux-musl]
# ghcr.io/cross-rs/x86_64-unknown-linux-musl:main
image = "ghcr.io/cross-rs/x86_64-unknown-linux-musl@sha256:dfb72a59029f50787396e5fe1c3d26b57cab78e326f434578e8719f0e12a8ecd"

[target.aarch64-unknown-linux-musl]
# ghcr.io/cross-rs/aarch64-unknown-linux-musl:main
image = "ghcr.io/cross-rs/aarch64-unknown-linux-musl@sha256:e148c4bc7bc3f5dfb252d2b546dafbc79f2d7eeba2d371b28a7b149270ffc331"
