[tools]
rust = "stable"
goreleaser = "2.17.1"

[tasks.prototype-schema]
description = "Run the throwaway SQLite schema prototype"
run = "cargo run --manifest-path prototypes/sqlite-schema/Cargo.toml --bin pg-probe-schema-prototype"

[tasks.demo-data]
description = "Generate disposable SQLite files with example data"
run = "cargo run --manifest-path prototypes/sqlite-schema/Cargo.toml --bin pg-probe-schema-prototype -- --write-demo"

[tasks.demo-report]
description = "Serve the complete SQLite demo through the read-only web viewer"
depends = ["demo-data"]
run = "cargo run --manifest-path prototypes/sqlite-schema/Cargo.toml --bin server -- prototypes/sqlite-schema/demo/pg-probe-complete.sqlite"

[tasks.demo-report-partial]
description = "Serve the partial SQLite demo through the read-only web viewer"
depends = ["demo-data"]
run = "cargo run --manifest-path prototypes/sqlite-schema/Cargo.toml --bin server -- prototypes/sqlite-schema/demo/pg-probe-partial.sqlite"
