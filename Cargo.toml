[package]
name = "pg-probe"
version = "0.1.0"
edition = "2021"
description = "Capture a portable PostgreSQL and Linux diagnostic snapshot"
license = "PostgreSQL"
repository = "https://github.com/momoi-labs/pg-probe"
rust-version = "1.85"

[dependencies]
axum = "0.8.4"
chrono = { version = "0.4.45", default-features = false, features = ["std"] }
clap = { version = "4.5.61", features = ["derive"] }
flate2 = "1.1.9"
libc = "0.2.189"
postgres = "0.19.12"
postgres_rustls = "0.1.0"
refinery = { version = "0.9.2", default-features = false, features = ["rusqlite"] }
rusqlite = { version = "0.39.0", default-features = false, features = ["bundled", "modern_sqlite", "serialize"] }
rustls = "0.23.43"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
thiserror = "2.0.20"
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "ansi", "std"] }
tokio = { version = "1.49.0", features = ["macros", "net", "rt-multi-thread", "signal"] }
uuid = { version = "1.20.0", features = ["v4"] }
webpki-roots = "1.0.6"
ratatui = "0.29.0"

[dev-dependencies]
assert_cmd = "2.1.2"
predicates = "3.1.4"
tempfile = "3.27.0"
