[package]
name = "pg-probe"
version = "0.1.0"
edition = "2021"
description = "Capture a portable PostgreSQL and Linux diagnostic snapshot"
license = "Apache-2.0"
repository = "https://github.com/momoi-labs/pg-probe"
rust-version = "1.85"

[dependencies]
chrono = { version = "0.4.45", default-features = false, features = ["std"] }
clap = { version = "4.5.61", features = ["derive"] }
flate2 = "1.1.9"
libc = "0.2.189"
libpq = { version = "5.0", default-features = false, features = ["v15"] }
rusqlite = { version = "0.40.2", default-features = false, features = ["bundled", "modern_sqlite"] }
thiserror = "2.0.20"
uuid = { version = "1.20.0", features = ["v4"] }

[dev-dependencies]
assert_cmd = "2.1.2"
predicates = "3.1.4"
tempfile = "3.27.0"
