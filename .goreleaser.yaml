# GoReleaser configuration for pg-probe musl Linux releases.
# Builds use cargo-zigbuild; Zig provides the musl cross toolchain directly.
# Publication (draft → attest → publish) stays in .github/workflows/release.yml so
# native smoke gates run against the exact archives before any GitHub Release.
version: 2

project_name: pg-probe

builds:
  - id: pg-probe
    builder: rust
    binary: pg-probe
    tool: cargo
    command: zigbuild
    flags:
      - --release
      - --locked
    targets:
      - x86_64-unknown-linux-musl
      - aarch64-unknown-linux-musl

archives:
  - id: musl
    ids:
      - pg-probe
    formats:
      - tar.gz
    # Matches the packaging contract: pg-probe-v<VERSION>-<rust-target>.tar.gz
    name_template: "{{ .ProjectName }}-v{{ .Version }}-{{ .Target }}"
    wrap_in_directory: true
    builds_info:
      owner: root
      group: root
      mtime: "{{ .CommitDate }}"
    files:
      - src: LICENSE
        dst: LICENSE
        info:
          owner: root
          group: root
          mode: 0o644
          mtime: "{{ .CommitDate }}"
      - src: README.md
        dst: README.md
        info:
          owner: root
          group: root
          mode: 0o644
          mtime: "{{ .CommitDate }}"

# Debian and RHEL packages around the same static musl binary. The binary
# links no libc, so the packages declare no dependencies and install on any
# release of either family.
nfpms:
  - id: packages
    ids:
      - pg-probe
    package_name: pg-probe
    file_name_template: "{{ .ConventionalFileName }}"
    vendor: Momoi Labs
    maintainer: Momoi Labs <https://github.com/momoi-labs>
    homepage: https://github.com/momoi-labs/pg-probe
    description: |-
      PostgreSQL and Linux host diagnostics in one portable SQLite file.
      Captures a time-bounded dataset, serves a review console for it, and
      shows the queries running now.
    license: PostgreSQL
    formats:
      - deb
      - rpm
    bindir: /usr/bin
    mtime: "{{ .CommitDate }}"
    contents:
      - src: LICENSE
        dst: /usr/share/doc/pg-probe/copyright
        packager: deb
        file_info:
          mode: 0o644
          mtime: "{{ .CommitDate }}"
      - src: LICENSE
        dst: /usr/share/licenses/pg-probe/LICENSE
        packager: rpm
        type: license
        file_info:
          mode: 0o644
          mtime: "{{ .CommitDate }}"
      - src: README.md
        dst: /usr/share/doc/pg-probe/README.md
        file_info:
          mode: 0o644
          mtime: "{{ .CommitDate }}"

checksum:
  name_template: SHA256SUMS
  algorithm: sha256

changelog:
  disable: true

# Publishing is performed by the release workflow after native execution gates,
# checksum verification, and keyless attestations succeed.
release:
  disable: true
